<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VVDA Bookings – Autumn 2026</title>
  <style>
    :root {
      --bg: #121216;
      --card: #1e1e26;
      --card-border: #2c2c38;
      --text: #f5f5f7;
      --muted: #9898a6;
      --accent: #d4af37;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.22);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.18);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.18);
      --grey-bg: rgba(152, 152, 166, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 72px;
      min-height: 100vh;
    }
    header {
      background: #000000;
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-text { flex: 1; min-width: 0; }
    .logo-text {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 1px; letter-spacing: -0.2px; }
    .subtitle { font-size: 12px; color: var(--muted); }
    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 8px;
    }
    .filters, .status-filters, .month-filters, .classtype-filters {
      display: flex;
      gap: 8px;
      padding: 10px 16px 8px;
      overflow-x: auto;
      background: #18181f;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar, .status-filters::-webkit-scrollbar, .month-filters::-webkit-scrollbar, .classtype-filters::-webkit-scrollbar { display: none; }
    .classtype-filters { padding-top: 12px; padding-bottom: 8px; }
    .month-filters { padding-top: 10px; padding-bottom: 6px; }
    .status-filters { padding-top: 0; padding-bottom: 14px; border-bottom: 1px solid var(--card-border); }
    .filter-btn {
      flex-shrink: 0;
      padding: 8px 15px;
      border-radius: 22px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--card-border);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #121216;
      border-color: var(--accent);
      font-weight: 600;
    }
    .search-box { padding: 12px 16px; background: #18181f; }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search-box input::placeholder { color: var(--muted); }
    .stats {
      display: flex;
      gap: 16px;
      padding: 11px 16px;
      font-size: 13px;
      color: var(--muted);
      background: #18181f;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
    }
    .stats strong { color: var(--text); font-weight: 600; }
    .list { padding: 14px 12px 24px; }
    .section-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 18px 6px 12px;
      padding-top: 6px;
    }
    .day-group { margin-bottom: 20px; }
    .day-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 6px 10px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 9px;
      border: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .card.available { opacity: 0.52; }
    .card.confirmed {
      border-color: rgba(34, 197, 94, 0.35);
      background: linear-gradient(135deg, #1e1e26 0%, #1a241e 100%);
    }
    .card.holiday { opacity: 0.5; }
    .card-left { flex: 1; min-width: 0; }
    .time { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .student { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student.empty { color: var(--muted); font-weight: 400; font-style: italic; }
    .class-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .student-list { list-style: none; padding: 0; margin: 0; }
    .student-list li {
      font-size: 14px;
      color: var(--text);
      padding: 3px 0 3px 14px;
      position: relative;
    }
    .student-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
    }
    .holiday-note {
      font-size: 12px;
      color: var(--red);
      margin-top: 8px;
      font-style: italic;
    }
    .badge {
      flex-shrink: 0;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.confirmed {
      background: var(--green-bg);
      color: var(--green);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25);
    }
    .badge.tbc { background: var(--amber-bg); color: var(--amber); }
    .badge.cancelled { background: var(--red-bg); color: var(--red); }
    .badge.available { background: var(--grey-bg); color: var(--muted); }
    .badge.count {
      background: var(--green-bg);
      color: var(--green);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25);
    }
    .badge.count.empty { background: var(--grey-bg); color: var(--muted); box-shadow: none; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state h3 { font-size: 17px; margin-bottom: 6px; color: var(--text); }
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #18181f;
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

  let currentTeacher = "all";
  let currentStatus = "all";
  let currentMonth = "all";
  let currentClassType = "all";
  let searchTerm = "";

  function matchesTeacher(row, teacher) {
    if (teacher === "all") return true;
    return (row.teachers || '').toLowerCase().includes(teacher.toLowerCase());
  }
  function matchesStatus(row, status) {
    if (status === "all") return true;
    return row.status === status;
  }
  function matchesMonth(row, month) {
    if (month === "all") return true;
    return row.date.substring(5, 7) === month;
  }
  function matchesSearchPrivate(row, term) {
    if (!term) return true;
    return (row.student || '').toLowerCase().includes(term.toLowerCase());
  }
  function matchesSearchGroup(row, term) {
    if (!term) return true;
    if ((row.className || '').toLowerCase().includes(term.toLowerCase())) return true;
    return (row.students || []).some(s => s.toLowerCase().includes(term.toLowerCase()));
  }
  function formatDate(iso) {
    const d = new Date(iso + "T12:00:00");
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()];
  }
  const dayOrder = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
  const dayFull = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" };

  function renderPrivateSection(rows) {
    if (rows.length === 0) return '';
    const groups = {};
    rows.forEach(r => {
      if (!groups[r.date]) groups[r.date] = [];
      groups[r.date].push(r);
    });
    const sortedDates = Object.keys(groups).sort();
    let html = '<div class="section-header">Private Classes</div>';
    sortedDates.forEach(date => {
      html += '<div class="day-group"><div class="day-header">' + formatDate(date) + '</div>';
      groups[date].forEach(r => {
        const statusClass = (r.status || '').toLowerCase();
        const isEmpty = !r.student;
        const cardExtra = statusClass === "confirmed" ? " confirmed" : (statusClass === "available" ? " available" : "");
        html += '<div class="card' + cardExtra + '">' +
          '<div class="card-left">' +
            '<div class="time">' + r.time + ' · ' + r.studio + '</div>' +
            '<div class="meta">' + r.teachers + '</div>' +
            '<div class="student ' + (isEmpty ? "empty" : "") + '">' + (isEmpty ? "— available —" : r.student) + '</div>' +
            (r.notes ? '<div class="meta" style="margin-top:4px">' + r.notes + '</div>' : '') +
          '</div>' +
          '<div class="badge ' + statusClass + '">' + r.status + '</div>' +
        '</div>';
      });
      html += '</div>';
    });
    return html;
  }

  function renderGroupSection(rows) {
    if (rows.length === 0) return '';
    const sorted = [...rows].sort((a, b) => (dayOrder[a.day] - dayOrder[b.day]) || a.time.localeCompare(b.time));
    const groups = {};
    sorted.forEach(r => {
      if (!groups[r.day]) groups[r.day] = [];
      groups[r.day].push(r);
    });
    let html = '<div class="section-header">Group Classes</div>';
    Object.keys(groups).sort((a, b) => dayOrder[a] - dayOrder[b]).forEach(day => {
      html += '<div class="day-group"><div class="day-header">' + dayFull[day] + '</div>';
      groups[day].forEach(r => {
        const isEmpty = r.count === 0;
        const cardExtra = r.holidayNote ? " holiday" : (r.count > 0 ? " confirmed" : " available");
        const studentListHtml = r.students && r.students.length
          ? '<ul class="student-list">' + r.students.map(s => '<li>' + s + '</li>').join('') + '</ul>'
          : '<div class="student empty">— no students —</div>';
        html += '<div class="card' + cardExtra + '">' +
          '<div class="card-left">' +
            '<div class="time">' + r.time + ' · ' + r.studio + '</div>' +
            '<div class="meta">' + r.teachers + '</div>' +
            '<div class="class-name">' + r.className + '</div>' +
            studentListHtml +
            (r.holidayNote ? '<div class="holiday-note">' + r.holidayNote + '</div>' : '') +
          '</div>' +
          '<div class="badge count' + (isEmpty ? ' empty' : '') + '">' + r.count + ' booked</div>' +
        '</div>';
      });
      html += '</div>';
    });
    return html;
  }

  function render() {
    const filteredPrivate = privateRows.filter(r =>
      matchesTeacher(r, currentTeacher) &&
      matchesStatus(r, currentStatus) &&
      matchesMonth(r, currentMonth) &&
      matchesSearchPrivate(r, searchTerm)
    );
    const filteredGroup = groupRows.filter(r =>
      matchesTeacher(r, currentTeacher) &&
      matchesSearchGroup(r, searchTerm)
    );

    const showPrivate = currentClassType === "all" || currentClassType === "Private";
    const showGroup = currentClassType === "all" || currentClassType === "Group";

    const confirmed = filteredPrivate.filter(r => r.status === "Confirmed").length;
    const tbc = filteredPrivate.filter(r => r.status === "TBC").length;
    const available = filteredPrivate.filter(r => r.status === "Available").length;
    const totalGroupStudents = filteredGroup.reduce((sum, r) => sum + r.count, 0);

    let statsHtml = '';
    if (showPrivate) {
      statsHtml += "<span><strong>" + filteredPrivate.length + "</strong> private shown</span>" +
        "<span><strong>" + confirmed + "</strong> confirmed</span>" +
        "<span><strong>" + tbc + "</strong> TBC</span>" +
        "<span><strong>" + available + "</strong> available</span>";
    }
    if (showGroup) {
      statsHtml += "<span><strong>" + filteredGroup.length + "</strong> group classes</span>" +
        "<span><strong>" + totalGroupStudents + "</strong> group students</span>";
    }
    document.getElementById("stats").innerHTML = statsHtml;

    document.getElementById("monthFilters").style.display = showPrivate ? "flex" : "none";
    document.getElementById("statusFilters").style.display = showPrivate ? "flex" : "none";

    let listHtml = '';
    if (showGroup) listHtml += renderGroupSection(filteredGroup);
    if (showPrivate) listHtml += renderPrivateSection(filteredPrivate);

    if (!listHtml) {
      listHtml = '<div class="empty-state"><h3>No classes match</h3><p>Try changing the filters</p></div>';
    }
    document.getElementById("list").innerHTML = listHtml;
  }

  document.getElementById("classTypeFilters").addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    document.querySelectorAll("#classTypeFilters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentClassType = e.target.dataset.classtype;
    render();
  });
  document.getElementById("monthFilters").addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    document.querySelectorAll("#monthFilters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentMonth = e.target.dataset.month;
    render();
  });
  document.getElementById("teacherFilters").addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    document.querySelectorAll("#teacherFilters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentTeacher = e.target.dataset.teacher;
    render();
  });
  document.getElementById("statusFilters").addEventListener("click", e => {
    if (!e.target.classList.contains("filter-btn")) return;
    document.querySelectorAll("#statusFilters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentStatus = e.target.dataset.status;
    render();
  });
  document.getElementById("searchInput").addEventListener("input", e => {
    searchTerm = e.target.value;
    render();
  });

  render();
</script>
</body>
</html>
